  <text x="50" y="62" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFD700" text-anchor="middle">NBM</text>
  <text x="140" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">National Bank</text>

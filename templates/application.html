{% extends "base.html" %}
{% block title %}{{ t('app_form_title') }} — MABANKI-ONE{% endblock %}
{% block content %}

<div class="narrow">
<div class="card">
    <h1>{{ t('app_form_title') }}</h1>

    <form method="POST" action="{{ url_for('applications.details', app_id=application.id) }}">
        <fieldset>
            <legend>Personal Information</legend>

            <div class="form-row">
                <label for="fullname">{{ t('auth_fullname') }}</label>
                <input type="text" id="fullname" name="fullname" value="{{ application.full_name or '' }}" required>
            </div>

            <div class="form-grid">
                <div class="form-row">
                    <label for="national_id">{{ t('app_national_id') }}</label>
                    <input type="text" id="national_id" name="national_id" value="{{ application.national_id or '' }}" required>
                </div>
                <div class="form-row">
                    <label for="dob">{{ t('app_dob') }}</label>
                    <input type="date" id="dob" name="dob" value="{{ application.dob or '' }}" required>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-row">
                    <label for="gender">{{ t('app_gender') }}</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select...</option>
                        <option value="Male" {% if application.gender == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if application.gender == 'Female' %}selected{% endif %}>Female</option>
                        <option value="Other" {% if application.gender == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="phone">{{ t('auth_phone') }}</label>
                    <input type="tel" id="phone" name="phone" value="{{ application.phone or '' }}" required>
                </div>
            </div>

            <div class="form-row">
                <label for="email">{{ t('auth_email') }}</label>
                <input type="email" id="email" name="email" value="{{ application.email or '' }}" required>
            </div>

            <div class="form-row">
                <label for="occupation">{{ t('app_occupation') }}</label>
                <input type="text" id="occupation" name="occupation" value="{{ application.occupation or '' }}" required>
            </div>

            <div class="form-row">
                <label for="address">{{ t('app_address') }}</label>
                <textarea id="address" name="address" rows="3" required>{{ application.address or '' }}</textarea>
            </div>
        </fieldset>

        <fieldset>
            <legend>Account Details</legend>

            <div class="form-grid">
                <div class="form-row">
                    <label for="bank">{{ t('app_select_bank') }}</label>
                    <select id="bank" name="bank" required>
                        <option value="">Select a bank...</option>
                        {% for bank in banks %}
                        <option value="{{ bank.name }}" {% if application.bank_name == bank.name %}selected{% endif %}>{{ bank.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-row">
                    <label for="account_type">{{ t('app_account_type') }}</label>
                    <select id="account_type" name="account_type" required>
                        <option value="">Select account type...</option>
                        <option value="Savings Account" {% if application.account_type == 'Savings Account' %}selected{% endif %}>Savings Account</option>
                        <option value="Current Account" {% if application.account_type == 'Current Account' %}selected{% endif %}>Current Account</option>
                        <option value="Student Account" {% if application.account_type == 'Student Account' %}selected{% endif %}>Student Account</option>
                        <option value="Business Account" {% if application.account_type == 'Business Account' %}selected{% endif %}>Business Account</option>
                    </select>
                </div>
            </div>
        </fieldset>

        <div class="form-actions">
            <a class="btn btn-ghost" href="{{ url_for('main.select_bank') }}">{{ t('app_back') }}</a>
            <button type="submit" class="btn btn-primary">{{ t('app_save_continue') }}</button>
        </div>
    </form>
</div>
</div>

{% endblock %}

Then we should create upload.html file inside our template folder 
<!DOCTYPE html>
<html>
<head>

<title>Upload Documents</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

.container{
width:70%;
margin:30px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

h2{
text-align:center;
color:#003366;
}

label{
font-weight:bold;
display:block;
margin-top:20px;
}

input[type=file]{
width:100%;
padding:10px;
}

button{
margin-top:30px;
width:100%;
padding:15px;
background:#003366;
color:white;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#0055aa;
}

</style>

</head>

<body>

<header>

<h1>MABANKI ONE</h1>

</header>

<div class="container">

<h2>Upload Required Documents</h2>

<form action="/review" method="POST" enctype="multipart/form-data">

<input type="hidden" name="bank" value="{{ bank }}">
<input type="hidden" name="fullname" value="{{ fullname }}">
<input type="hidden" name="nationalid" value="{{ nationalid }}">
<input type="hidden" name="dob" value="{{ dob }}">
<input type="hidden" name="gender" value="{{ gender }}">
<input type="hidden" name="phone" value="{{ phone }}">
<input type="hidden" name="email" value="{{ email }}">
<input type="hidden" name="occupation" value="{{ occupation }}">
<input type="hidden" name="address" value="{{ address }}">
<input type="hidden" name="accounttype" value="{{ accounttype }}">

<label>National ID Copy</label>
<input type="file" name="idcopy" required>

<label>Passport Photo</label>
<input type="file" name="photo" required>

<label>Proof of Residence</label>
<input type="file" name="residence" required>

<label>Employment Letter (Optional)</label>
<input type="file" name="employment">

<label>Business Registration Certificate (Optional)</label>
<input type="file" name="business">

<button type="submit">

Continue

</button>

</form>

</div>

</body>

</html>
